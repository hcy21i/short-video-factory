name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      ANALYTICS_DISTRIBUTION_CHANNEL: self_build

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.12.4
          pnpm install

      # Windows Build
      - name: Build Windows
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: release/**/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate, upload and publish complete release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger documentation deployment
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DOCS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DOCS_DEPLOY_HOOK is not configured; documentation deployment skipped."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 10 \
            --request POST "$DEPLOY_HOOK"
